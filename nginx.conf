server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers. No `add_header` is used in the child location blocks
  # below, so nginx inherits these site-wide (add_header does NOT merge across
  # levels — defining one in a child would drop these).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Vite emits content-hashed filenames here, so they can be cached forever.
  # `expires` sets Cache-Control without `add_header`, preserving the headers above.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # App shell + client-side anchors fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
